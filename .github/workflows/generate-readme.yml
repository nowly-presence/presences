name: Generate README

on:
  pull_request_target:
    types: [closed]
    paths:
      - "src/**"

jobs:
  generate:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'new')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: stable
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tsx
        run: npm install tsx

      - name: Generate README table
        run: npx tsx scripts/generate-readme.ts

      - name: Commit if changed
        run: |
          git config user.name "Nolo[bot]"
          git config user.email "4160418+nowly-nolo[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to README"
          else
            git commit -m "chore: update README table"
            git push
          fi
