name: Publish Presence

on:
  pull_request_target:
    types: [closed]
    paths:
      - "src/**"

concurrency:
  group: publish-presence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: presences,internal-cli

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: stable
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nowly-presence/internal-cli
          token: ${{ steps.app-token.outputs.token }}
          path: .internal-cli

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install trusted presence dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts --filter @nowly/presences...

      - name: Install internal-cli dependencies
        working-directory: .internal-cli
        run: npm install

      - name: Detect changed and removed presence slugs
        id: changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p .nolo
          pnpm --dir packages/presences exec tsx scripts/nolo/collect-files.ts \
            --pull-request "${{ github.event.pull_request.number }}" \
            --output .nolo/files.json \
            --context-output .nolo/context.json
          BASE_SHA="${{ github.event.pull_request.base.sha }}" \
          HEAD_SHA="${{ github.event.pull_request.head.sha }}" \
            pnpm --dir packages/presences exec tsx scripts/nolo/resolve-changes.ts \
              --files .nolo/files.json \
              --output .nolo/changes.json
          pnpm --dir packages/presences exec tsx scripts/nolo/publish-selection.ts \
            --input .nolo/changes.json

      - name: Credit PR author as contributor
        if: steps.changed.outputs.slugs != ''
        env:
          PR_LOGIN: ${{ github.event.pull_request.user.login }}
          CHANGED_SLUGS: ${{ steps.changed.outputs.slugs }}
        run: |
          CHANGED=0

          while IFS= read -r slug; do
            [ -z "$slug" ] && continue

            dir=""
            while IFS= read -r d; do
              [ -f "$d/metadata.json" ] || continue
              name=$(basename "$d" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
              if [ "$name" = "$slug" ]; then
                dir="$d"
                break
              fi
            done < <(find src -mindepth 2 -maxdepth 2 -type d)
            [ -z "$dir" ] && continue

            META="$dir/metadata.json"
            ALREADY=$(jq --arg login "$PR_LOGIN" '
              ([.author.github // ""] + [.contributors[]?.github // ""])
              | map(ascii_downcase) | index($login | ascii_downcase) != null
            ' "$META")

            if [ "$ALREADY" != "true" ]; then
              jq --arg login "$PR_LOGIN" \
                '.contributors = ((.contributors // []) + [{name: $login, github: $login}])' \
                "$META" > "$META.tmp"
              mv "$META.tmp" "$META"
              CHANGED=1
              echo "Credited @$PR_LOGIN on $slug"
            fi
          done <<< "$CHANGED_SLUGS"

          if [ "$CHANGED" = "1" ]; then
            git config user.name "Nolo[bot]"
            git config user.email "4160418+nowly-nolo[bot]@users.noreply.github.com"
            git add src
            git commit -m "chore: credit @$PR_LOGIN as contributor"
            git push origin HEAD:stable
          fi

      - name: Push changed presences to API and CDN
        if: steps.changed.outputs.slugs != ''
        env:
          API_URL: ${{ secrets.API_URL }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          CHANGED_SLUGS: ${{ steps.changed.outputs.slugs }}
        run: |
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            echo "Pushing $slug..."
            "$GITHUB_WORKSPACE/.internal-cli/node_modules/.bin/tsx" --tsconfig "$GITHUB_WORKSPACE/.internal-cli/tsconfig.json" "$GITHUB_WORKSPACE/.internal-cli/index.ts" push "$slug" \
              --patch \
              --source pr \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --pr "#$PR_NUMBER" \
              --pr-title "$PR_TITLE" \
              --author "$PR_AUTHOR"
          done <<< "$CHANGED_SLUGS"

      - name: Archive removed presences
        if: steps.changed.outputs.removed != ''
        env:
          API_URL: ${{ secrets.API_URL }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REMOVED_SLUGS: ${{ steps.changed.outputs.removed }}
        run: |
          SLUG_ARGS=()
          while IFS= read -r slug; do
            [ -z "$slug" ] || SLUG_ARGS+=("$slug")
          done <<< "$REMOVED_SLUGS"

          [ "${#SLUG_ARGS[@]}" -gt 0 ] || exit 0
          echo "Archiving ${#SLUG_ARGS[@]} presence(s)..."
          "$GITHUB_WORKSPACE/.internal-cli/node_modules/.bin/tsx" --tsconfig "$GITHUB_WORKSPACE/.internal-cli/tsconfig.json" "$GITHUB_WORKSPACE/.internal-cli/index.ts" archive "${SLUG_ARGS[@]}" \
            --source pr \
            --pr "#$PR_NUMBER" \
            --pr-title "$PR_TITLE"
