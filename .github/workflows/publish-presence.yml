name: Publish Presence

on:
  pull_request_target:
    types: [closed]
    paths:
      - "src/**"

concurrency:
  group: publish-presence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: presences,internal-cli

      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          repository: nowly-presence/internal-cli
          token: ${{ steps.app-token.outputs.token }}
          path: .internal-cli

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install internal-cli dependencies
        working-directory: .internal-cli
        run: npm install

      - name: Detect changed and removed presence slugs
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          slug_from_paths() {
            sed -n 's|^src/[^/]*/\([^/]*\)/.*|\1|p' \
              | tr '[:upper:]' '[:lower:]' \
              | tr ' ' '-' \
              | sort -u
          }

          SLUGS=$(git diff --name-only --diff-filter=AMR "$BASE"..."$HEAD" -- src/ | slug_from_paths)
          DELETED=$(git diff --name-only --diff-filter=D "$BASE"..."$HEAD" -- src/ | slug_from_paths)

          CURRENT=""
          if [ -d src ]; then
            CURRENT=$(find src -mindepth 2 -maxdepth 2 -type d \
              | while IFS= read -r dir; do
                  [ -f "$dir/metadata.json" ] || continue
                  basename "$dir" | tr '[:upper:]' '[:lower:]' | tr ' ' '-'
                done | sort -u)
          fi

          REMOVED=""
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            if ! printf '%s\n' "$CURRENT" | grep -qx "$slug"; then
              REMOVED="$REMOVED$slug"$'\n'
            fi
          done <<< "$DELETED"

          echo "Changed slugs:"
          echo "$SLUGS"
          echo "Removed slugs:"
          echo "$REMOVED"

          {
            echo "slugs<<EOF"
            [ -n "$SLUGS" ] && printf '%s\n' "$SLUGS"
            echo "EOF"
            echo "removed<<EOF"
            [ -n "$REMOVED" ] && printf '%s\n' "$REMOVED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Credit PR author as contributor
        if: >
          steps.changed.outputs.slugs != ''
          && (contains(github.event.pull_request.labels.*.name, 'new')
            || contains(github.event.pull_request.labels.*.name, 'update'))
        run: |
          PR_LOGIN="${{ github.event.pull_request.user.login }}"
          CHANGED=0

          while IFS= read -r slug; do
            [ -z "$slug" ] && continue

            dir=""
            while IFS= read -r d; do
              [ -f "$d/metadata.json" ] || continue
              name=$(basename "$d" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
              if [ "$name" = "$slug" ]; then
                dir="$d"
                break
              fi
            done < <(find src -mindepth 2 -maxdepth 2 -type d)
            [ -z "$dir" ] && continue

            META="$dir/metadata.json"
            ALREADY=$(jq --arg login "$PR_LOGIN" '
              ([.author.github // ""] + [.contributors[]?.github // ""])
              | map(ascii_downcase) | index($login | ascii_downcase) != null
            ' "$META")

            if [ "$ALREADY" != "true" ]; then
              jq --arg login "$PR_LOGIN" \
                '.contributors = ((.contributors // []) + [{name: $login, github: $login}])' \
                "$META" > "$META.tmp"
              mv "$META.tmp" "$META"
              CHANGED=1
              echo "Credited @$PR_LOGIN on $slug"
            fi
          done <<< "${{ steps.changed.outputs.slugs }}"

          if [ "$CHANGED" = "1" ]; then
            git config user.name "Nolo[bot]"
            git config user.email "4160418+nowly-nolo[bot]@users.noreply.github.com"
            git add src
            git commit -m "chore: credit @$PR_LOGIN as contributor"
            git push origin HEAD:stable
          fi

      - name: Push changed presences to API and CDN
        if: >
          steps.changed.outputs.slugs != ''
          && (contains(github.event.pull_request.labels.*.name, 'new')
            || contains(github.event.pull_request.labels.*.name, 'update'))
        env:
          API_URL: ${{ secrets.API_URL }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            echo "Pushing $slug..."
            "$GITHUB_WORKSPACE/.internal-cli/node_modules/.bin/tsx" --tsconfig "$GITHUB_WORKSPACE/.internal-cli/tsconfig.json" "$GITHUB_WORKSPACE/.internal-cli/index.ts" push "$slug" \
              --patch \
              --ai \
              --source pr \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --pr "#${{ github.event.pull_request.number }}" \
              --pr-title "${{ github.event.pull_request.title }}" \
              --author "$PR_AUTHOR"
          done <<< "${{ steps.changed.outputs.slugs }}"

      - name: Archive removed presences
        if: steps.changed.outputs.removed != ''
        env:
          API_URL: ${{ secrets.API_URL }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        run: |
          SLUGS=""
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            SLUGS="$SLUGS $slug"
          done <<< "${{ steps.changed.outputs.removed }}"

          echo "Archiving$SLUGS"
          "$GITHUB_WORKSPACE/.internal-cli/node_modules/.bin/tsx" --tsconfig "$GITHUB_WORKSPACE/.internal-cli/tsconfig.json" "$GITHUB_WORKSPACE/.internal-cli/index.ts" archive $SLUGS \
            --source pr \
            --pr "#${{ github.event.pull_request.number }}" \
            --pr-title "${{ github.event.pull_request.title }}"
